# Render Blueprint for the CARISCA website: two independent web services from one repository.
# Docs: docs/render-deployment.md
#
# Values marked `sync: false` are entered in the Render dashboard when the Blueprint is created
# (Render prompts for them). Secrets are generated by Render and never stored in Git.

services:
  # ------------------------------------------------------------------ API (Express)
  - type: web
    name: carisca-api
    runtime: node
    rootDir: backend
    region: frankfurt
    # A persistent disk (for uploaded media) and pre-deploy migrations need a paid instance.
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run prod:migrate && npm run prod:seed
    startCommand: npm start
    healthCheckPath: /api/v1/health
    disk:
      name: carisca-storage
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: STORAGE_DIR
        value: /var/data
      # Render's load balancer + the website's /api/v1 proxy = 2 hops before the API.
      - key: TRUST_PROXY
        value: "2"
      - key: SESSION_SECRET
        generateValue: true
      - key: REVALIDATE_SECRET
        generateValue: true
      - key: API_DOCS_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: info
      # e.g. https://carisca-api.onrender.com  (used in media URLs)
      - key: API_PUBLIC_URL
        sync: false
      # The website origin(s), e.g. https://carisca-web.onrender.com
      - key: FRONTEND_URL
        sync: false
      # e.g. https://carisca-web.onrender.com/api/revalidate
      - key: REVALIDATE_URL
        sync: false
      # MySQL (e.g. the cPanel database with Render's outbound IPs allowed under Remote MySQL)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Optional email
      - key: SMTP_HOST
        sync: false
      - key: MAIL_FROM
        sync: false

  # ------------------------------------------------------------------ Website (Next.js)
  - type: web
    name: carisca-web
    runtime: node
    rootDir: frontend
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:standalone
    healthCheckPath: /robots.txt
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Next's standalone server must listen on all interfaces inside Render's container.
      - key: HOSTNAME
        value: 0.0.0.0
      # The browser talks to the API through this site's /api/v1 proxy (same origin), because
      # *.onrender.com services are different "sites" for cookie purposes.
      # e.g. https://carisca-web.onrender.com/api/v1   (embedded at build time)
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      # e.g. https://carisca-web.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      # Where /api/v1/* is proxied to, e.g. https://carisca-api.onrender.com (build time)
      - key: API_PROXY_TARGET
        sync: false
      # Server-side data fetching goes straight to the API, e.g. https://carisca-api.onrender.com/api/v1
      - key: API_INTERNAL_BASE_URL
        sync: false
      - key: REVALIDATE_SECRET
        fromService:
          type: web
          name: carisca-api
          envVarKey: REVALIDATE_SECRET
      - key: CONTENT_REVALIDATE_SECONDS
        value: "300"
